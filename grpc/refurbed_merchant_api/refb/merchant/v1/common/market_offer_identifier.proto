syntax = "proto3";

package refb.merchant.v1;

import "google/api/field_behavior.proto";
import "refb/merchant/v1/common/offer_identifier.proto";

option go_package = "refurbed/grpc/generated/merchant/v1";

message MarketOfferIdentifier {
  OfferIdentifier offer_id = 1 [(google.api.field_behavior) = REQUIRED];

  string market_code = 2 [(google.api.field_behavior) = REQUIRED];
}
