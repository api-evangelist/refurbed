syntax = "proto3";

package refb.merchant.v1;

option go_package = "refurbed/grpc/generated/merchant/v1";

message OptionalUInt32RangeFilter {
  optional bool is_set = 1;
  optional uint32 gt = 2; // Greater than.
  optional uint32 ge = 3; // Greater than or equal to.
  repeated uint32 any_of = 4;
  repeated uint32 none_of = 5;
  optional uint32 le = 6; // Less than or equal to.
  optional uint32 lt = 7; // Less than.
}
