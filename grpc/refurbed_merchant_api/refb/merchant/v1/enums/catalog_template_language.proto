syntax = "proto3";

package refb.merchant.v1;

option go_package = "refurbed/grpc/generated/merchant/v1";

// Subset of languages supported for creating offers.
message TemplateLanguageCodeEnum {
  // Based on the https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes
  enum LanguageCode {
    UNSPECIFIED = 0;
    DE = 1;
    EN = 2;
  }
}
