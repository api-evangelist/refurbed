syntax = "proto3";

package refb.merchant.v1;

option go_package = "refurbed/grpc/generated/merchant/v1";

message OfferGradingEnum {
  // The grading of the item being sold.
  //
  // Please consult the refurbed seller guide and quality charta to learn about
  // refurbed's grading requirements.
  enum OfferGrading {
    UNSPECIFIED = 0;
    A = 1;
    B = 2;
    C = 3;
    AA = 4;
  }
}
