syntax = "proto3";

package refb.merchant.v1;

option go_package = "refurbed/grpc/generated/merchant/v1";

message OfferTaxationEnum {
  enum OfferTaxation {
    UNSPECIFIED = 0;
    GROSS = 1; // Offer prices are gross prices.
    MARGINAL = 2; // Offer prices are gross and marginally taxed.
  }
}
