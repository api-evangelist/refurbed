syntax = "proto3";

package refb.merchant.v1;

import "google/api/field_behavior.proto";
import "refb/merchant/v1/enums/country_code.proto";

option go_package = "refurbed/grpc/generated/merchant/v1";

// Paginates resources with buyback supplybox identifier key.
message BuybackSupplyboxIdentifierPagination {
  // Limit on the number of results to be returned. Between 1 and 100.
  // Default and maximum is 100.
  optional uint32 limit = 1;

  // Takes primary key of first or last resource in received list.
  oneof cursor {
    BuybackSupplyboxIdentifier ending_before = 2;
    BuybackSupplyboxIdentifier starting_after = 3;
  }

  message BuybackSupplyboxIdentifier {
    // Primary key of the bid.
    int64 bid_id = 1 [(google.api.field_behavior) = REQUIRED];
    // Two-letter code indicating the market
    CountryCodeEnum.CountryCode market_code = 2 [(google.api.field_behavior) = REQUIRED];
  }
}
