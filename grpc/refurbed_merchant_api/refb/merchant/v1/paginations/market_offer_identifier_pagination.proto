syntax = "proto3";

package refb.merchant.v1;

import "refb/merchant/v1/common/market_offer_identifier.proto";

option go_package = "refurbed/grpc/generated/merchant/v1";

// Paginates resources with market offer identifier key.
message MarketOfferIdentifierPagination {
  // Limit on the number of results to be returned. Between 1 and 100.
  // Default and maximum is 100.
  optional uint32 limit = 1;

  // Takes primary key of first or last resource in received list.
  oneof cursor {
    MarketOfferIdentifier ending_before = 2;
    MarketOfferIdentifier starting_after = 3;
  }
}
