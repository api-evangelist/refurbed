syntax = "proto3";

package refb.partner.affiliate.v1;

option go_package = "refurbed/grpc/generated/partner/affiliate/v1";

// Paginates resources with string primary key.
message StringPagination {
  // Limit on the number of results to be returned. Between 1 and 100.
  // Default and maximum is 100.
  optional uint32 limit = 1;

  // Takes primary key of first or last resource in received list.
  oneof cursor {
    string ending_before = 2;
    string starting_after = 3;
  }
}
