    v1.BuybackOrderItem:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Primary key.
        order_id:
          type: string
          format: int64
          description: Primary key of the order this item belongs to.
        state:
          $ref: '#/components/schemas/BuybackOrderItemState'
          description: Status of this item.
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          title: Currency for the price
        price:
          type: string
          title: The amount the buyer has to pay if the item is accepted
        bid:
          $ref: '#/components/schemas/BuybackMarketBidSummary'
          title: The related market bid
        shipping_tracking_url:
          type:
          - string
          - 'null'
          description: Shipping tracking link, a valid HTTP(S) URL.
        shipping_tracking_number:
          type:
          - string
          - 'null'
        return_tracking_url:
          type:
          - string
          - 'null'
          description: Return tracking link, a valid HTTP(S) URL.
        return_tracking_number:
          type:
