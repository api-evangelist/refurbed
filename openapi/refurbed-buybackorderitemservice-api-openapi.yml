          - 'null'
      description: A buyback order item.
    BuybackOrderItemNotifyReturnedRequest:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: The id of the buyback order item to update.
          required:
          - id
        tracking_number:
          type: string
          title: Parcel tracking number
        tracking_url:
          type: string
          description: Needs to be a valid HTTP(S) URL.
          title: Parcel tracking link
      required:
      - id
    BuybackOrderItemUploadShippingLabelRequest:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: The id of the buyback order item to update
          required:
