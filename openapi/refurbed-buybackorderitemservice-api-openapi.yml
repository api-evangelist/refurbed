openapi: 3.2.0
info:
  title: Merchant Buyback Order Item Service API
  description: The refurbed merchant API allows to access and manage markets, currencies, instances, shipping profiles, offers, market offers, orders and order items.
  version: '1.0'
  contact:
    name: Refurbed Merchant Integrations Team
    email: integrations@refurbed.com
servers:
- url: https://api.refurbed.com
security:
- APIKeyAuth: []
tags:
- name: BuybackOrderItemService
paths:
  /refb.merchant.v1.BuybackOrderItemService/Accept:
    post:
      summary: Marks order item as accepted to indicate that the received item matches the…
      description: 'Transitions the order item from the `received` state to `accepted`.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when the buyback order item is not found or not in `received` state

        - FAILED_PRECONDITION

        - when the buyback order item is not in a state that permits this action

        - INVALID_ARGUMENT

        - when invalid arguments are provided'
      operationId: Accept
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuybackOrderItemAcceptResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderItemService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuybackOrderItemAcceptRequest'
        required: true
  /refb.merchant.v1.BuybackOrderItemService/ConfirmReceived:
    post:
      summary: Notifies that the merchant has received the item shipped by the seller
      description: 'Transitions the order item from the `label_sent` state to `received`.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when the buyback order item is not found or not in `label_sent` state

        - FAILED_PRECONDITION

        - when the buyback order item is not in a state that permits this action

        - INVALID_ARGUMENT

        - when invalid arguments are provided'
      operationId: ConfirmReceived
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuybackOrderItemConfirmReceivedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderItemService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuybackOrderItemConfirmReceivedRequest'
        required: true
  /refb.merchant.v1.BuybackOrderItemService/MakeSecondOffer:
    post:
      summary: Makes a second offer for the order item
      description: 'It is to indicate that the order item is different from the seller''s description,

        and the merchant is still considering buying it, albeit at a different price point.


        Transitions the order item from the `received` state to `second_offer`.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when the buyback order item is not found or not in `received` state

        - FAILED_PRECONDITION

        - when the buyback order item is not in a state that permits this action

        - when the market bid isn''t a valid second offer for the order item

        - INVALID_ARGUMENT

        - when invalid arguments are provided'
      operationId: MakeSecondOffer
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuybackOrderItemMakeSecondOfferResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderItemService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuybackOrderItemMakeSecondOfferRequest'
        required: true
  /refb.merchant.v1.BuybackOrderItemService/NotifyReturned:
    post:
      summary: Notifies that the merchant has shipped the rejected item
      description: 'Transitions the order item from the `rejected` state to `returned`.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when the buyback order item is not found or not in `rejected` state

        - FAILED_PRECONDITION

        - when the buyback order item is not in a state that permits this action

        - INVALID_ARGUMENT

        - when invalid arguments are provided'
      operationId: NotifyReturned
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuybackOrderItemNotifyReturnedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderItemService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuybackOrderItemNotifyReturnedRequest'
        required: true
  /refb.merchant.v1.BuybackOrderItemService/Reject:
    post:
      summary: Marks order item as rejected to indicate that the received item is different…
      description: 'Transitions the order item from the `received` state to `rejected`.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when the buyback order item is not found or not in `received` state

        - FAILED_PRECONDITION

        - when the buyback order item is not in a state that permits this action

        - INVALID_ARGUMENT

        - when invalid arguments are provided'
      operationId: Reject
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuybackOrderItemRejectResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderItemService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuybackOrderItemRejectRequest'
        required: true
  /refb.merchant.v1.BuybackOrderItemService/UploadShippingLabel:
    post:
      summary: Issues shipping label information for a buyback order item
      description: 'Transitions the order item from the `ordered` state to `label_sent`.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when the buyback order item is not found or not in `ordered` state

        - FAILED_PRECONDITION

        - when the buyback order item is not in a state that permits this action

        - INVALID_ARGUMENT

        - when invalid arguments are provided'
      operationId: UploadShippingLabel
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuybackOrderItemUploadShippingLabelResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderItemService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuybackOrderItemUploadShippingLabelRequest'
        required: true
components:
  schemas:
    BuybackOrderItemState:
      type: string
      enum:
      - UNSPECIFIED
      - ORDERED
      - LABEL_SENT
      - CANCELLED
      - RECEIVED
      - ACCEPTED
      - SECOND_OFFER
      - REJECTED
      - RETURNED
      default: UNSPECIFIED
      description: "- ORDERED: New order. Next state: LABEL_SENT\n - LABEL_SENT: Order item is ready to be shipped. Next state: CANCELLED, RECEIVED.\n - CANCELLED: Order item was never received. Final state.\n - RECEIVED: Order item was received by the merchant. Next state: ACCEPTED, SECOND_OFFER, REJECTED\n - ACCEPTED: Order item was accepted for fulfillment. Final Status\n - SECOND_OFFER: Order item was in worse conditions than expected, a second offer has been issued to the customer.\nNext state: ACCEPTED, REJECTED\n - REJECTED: Order item was refused. Next state: RETURNED\n - RETURNED: Order item was shipped back to customer. Final Status"
      title: Represents the state of an order item
    BuybackOrderItemConfirmReceivedResponse:
      type: object
      properties:
        order_item:
          $ref: '#/components/schemas/v1.BuybackOrderItem'
    BuybackAttribute:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Attribute ID
        name:
          type: string
          description: Human-readable name.
        type:
          $ref: '#/components/schemas/BuybackAttributeType'
          description: Type for the attribute.
        value_str:
          $ref: '#/components/schemas/StringValue'
          description: Value is set if type is ENUM.
        value_num:
          $ref: '#/components/schemas/NumericValue'
          description: Value is set if type is NUMERIC.
    BuybackOrderItemMakeSecondOfferResponse:
      type: object
      properties:
        order_item:
          $ref: '#/components/schemas/v1.BuybackOrderItem'
    BuybackMarketBidSummary:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Primary key
        product_id:
          type: string
          format: int64
          title: The product id
        product_name:
          type: string
          title: The user-friendly product_name
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/BuybackAttribute'
          title: List of attributes assigned to the product
        market_code:
          $ref: '#/components/schemas/CountryCode'
          title: Two-letter code indicating the market
        grading:
          $ref: '#/components/schemas/BuybackBidGrading'
          title: Grading for the desired product
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          title: Currency for the price
        price:
          type: string
          title: The price
        bid_id:
