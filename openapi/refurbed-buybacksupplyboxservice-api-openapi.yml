        type: integer
        format: int64
        x-nullable: true
        title: Stock the merchant is willing to buy
      market_code:
        $ref: '#/definitions/CountryCode'
        title: Two-letter code indicating the market
      grading:
        $ref: '#/definitions/BuybackBidGrading'
        title: Grading for the desired product
      currency_code:
        $ref: '#/definitions/CurrencyCode'
        title: Currency for the price
      winning_price:
        type: string
        title: The price that is currently winning the supplybox
      merchant_price:
        type: string
        title: 'The price the merchant is willing to pay for this product and grading

          If the merchant is winning the supplybox this will be equal to winning_price'
      suggested_price:
        type: string
        x-nullable: true
        description: 'The price the merchant needs to bid in order to win the supplybox

          This field is empty if the merchant has won the supplybox or if the bid is ineligible.'
      price_diff:
        type: string
        x-nullable: true
        description: 'Absolute difference between the current and suggested price

          This field is empty if the merchant has won the supplybox or if the bid is ineligible.'
      won_at:
        type: string
        format: date-time
        x-nullable: true
        description: 'When the supplybox was won.

          This field is empty if the merchant hasn''t won the supplybox.'
      state:
