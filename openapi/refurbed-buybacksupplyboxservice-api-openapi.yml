swagger: '2.0'
info:
  title: Affiliate Partner BuybackBidService BuybackSupplyboxService API
  version: '1.0'
  description: The refurbed affiliate partner API allows to retrieve info about markets, products and instances including the buybox info (current price, grading, warranty).
  contact:
    name: Refurbed Affiliate Partner Integrations Team
    email: integrations@refurbed.com
host: api.refurbed.com
schemes:
- https
consumes:
- application/json
produces:
- application/json
security:
- APIKeyAuth: []
tags:
- name: BuybackSupplyboxService
paths:
  /refb.merchant.v1.BuybackSupplyboxService/ListBuybackSupplyboxes:
    post:
      summary: Lists all supplyboxes.
      description: "Returns the current bid versions only.\n\nKnown errors:\n- UNAUTHENTICATED\n  - when no authorization header is sent\n  - when authorization header is malformed or invalid\n- PERMISSION_DENIED\n  - when the authorized user does not have permissions for this operation\n- INVALID_ARGUMENT\n  - when pagination limit is too large (>100)\n  - when both \"ending_before\" and \"starting_after\" are specified in pagination"
      operationId: ListBuybackSupplyboxes
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/ListBuybackSupplyboxesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ListBuybackSupplyboxesRequest'
      tags:
      - BuybackSupplyboxService
definitions:
  BuybackSupplyboxIdentifier:
    type: object
    properties:
      bid_id:
        type: string
        format: int64
        description: Primary key of the bid.
        required:
        - bid_id
      market_code:
        $ref: '#/definitions/CountryCode'
        title: Two-letter code indicating the market
    required:
    - bid_id
  BuybackSupplyboxState:
    type: string
    enum:
    - UNSPECIFIED
    - WON
    - ELIGIBLE
    - INELIGIBLE
    default: UNSPECIFIED
    description: "- WON: Currently winning the supplybox.\n - ELIGIBLE: Currently not winning the supplybox, but could with a better price.\n - INELIGIBLE: Cannot win the supplybox, e.g. because refurbed's\nSupplybox protection for this product is enabled and the offer's stock\nis too low."
    title: Represents the supplybox status of a bid
  BuybackAttribute:
    type: object
    properties:
      id:
        type: string
        format: int64
        title: Attribute ID
      name:
        type: string
        description: Human-readable name.
      type:
        $ref: '#/definitions/BuybackAttributeType'
        description: Type for the attribute.
      value_str:
        $ref: '#/definitions/StringValue'
        description: Value is set if type is ENUM.
      value_num:
        $ref: '#/definitions/NumericValue'
        description: Value is set if type is NUMERIC.
  BuybackBidGrading:
    type: string
    enum:
    - UNSPECIFIED
    - A
    - B
    - C
    - D
    - E
    default: UNSPECIFIED
  NumericRangeFilter:
    type: object
    properties:
      gt:
        type: string
        x-nullable: true
      ge:
        type: string
        x-nullable: true
      any_of:
        type: array
        items:
          type: string
      none_of:
        type: array
        items:
          type: string
      le:
        type: string
        x-nullable: true
      lt:
        type: string
        x-nullable: true
    description: 'Numeric range filter is used for decimal numbers. It is especially

      used for monetary amounts and other quantities where exactness is required.'
  StringSetContainsFilter:
    type: object
    properties:
      any_of:
        type: array
        items:
          type: string
      none_of:
        type: array
        items:
          type: string
      contains:
        type: string
        x-nullable: true
  Enum:
    type: object
    properties:
      id:
        type: string
        format: int64
      any_of:
        type: array
        items:
          type: string
      none_of:
        type: array
        items:
          type: string
  ListBuybackSupplyboxesRequest.Filter:
    type: object
    properties:
      bid_id:
        $ref: '#/definitions/Int64Filter'
      bid_created_at:
        $ref: '#/definitions/TimestampRangeFilter'
      won_at:
        $ref: '#/definitions/TimestampRangeFilter'
      product_id:
        $ref: '#/definitions/Int64Filter'
      grading:
        $ref: '#/definitions/BuybackBidGradingFilter'
      stock:
        $ref: '#/definitions/OptionalUInt32RangeFilter'
      market_code:
        $ref: '#/definitions/CountryCodeFilter'
      state:
        $ref: '#/definitions/BuybackSupplyboxStateFilter'
      merchant_price:
        $ref: '#/definitions/NumericRangeFilter'
      winning_price:
        $ref: '#/definitions/NumericRangeFilter'
      suggested_price:
        $ref: '#/definitions/OptionalNumericRangeFilter'
      price_difference:
        $ref: '#/definitions/OptionalNumericRangeFilter'
      product_name:
        $ref: '#/definitions/TextSearchFilter'
      product_attribute:
        $ref: '#/definitions/BuybackAttributeFilter'
      sku:
        $ref: '#/definitions/StringSetContainsFilter'
  BuybackBidGradingFilter:
    type: object
    properties:
