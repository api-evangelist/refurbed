swagger: '2.0'
info:
  title: Affiliate Partner BuybackBidService MarketService API
  version: '1.0'
  description: The refurbed affiliate partner API allows to retrieve info about markets, products and instances including the buybox info (current price, grading, warranty).
  contact:
    name: Refurbed Affiliate Partner Integrations Team
    email: integrations@refurbed.com
host: api.refurbed.com
schemes:
- https
consumes:
- application/json
produces:
- application/json
security:
- APIKeyAuth: []
tags:
- name: MarketService
paths:
  /refb.partner.affiliate.v1.MarketService/GetMarket:
    post:
      summary: Gets a single market.
      description: "Known errors:\n- UNAUTHENTICATED\n  - when no authorization header is sent\n  - when authorization header is malformed or invalid\n- PERMISSION_DENIED\n  - when the authorized user does not have permissions for this operation\n- NOT_FOUND\n  - when the market is not found"
      operationId: GetMarket
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/GetMarketResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/GetMarketRequest'
      tags:
      - MarketService
  /refb.partner.affiliate.v1.MarketService/ListMarkets:
    post:
      summary: Lists all markets.
      description: "Known errors:\n- UNAUTHENTICATED\n  - when no authorization header is sent\n  - when authorization header is malformed or invalid\n- PERMISSION_DENIED\n  - when the authorized user does not have permissions for this operation\n- INVALID_ARGUMENT\n  - when pagination limit is too large (>100)\n  - when both \"ending_before\" and \"starting_after\" are specified in pagination"
      operationId: ListMarkets
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/ListMarketsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ListMarketsRequest'
      tags:
      - MarketService
  /refb.merchant.v1.MarketService/GetMarket:
    post:
      summary: Gets a single market.
      description: "Known errors:\n- UNAUTHENTICATED\n  - when no authorization header is sent\n  - when authorization header is malformed or invalid\n- PERMISSION_DENIED\n  - when the authorized user does not have permissions for this operation\n- NOT_FOUND\n  - when the market is not found\n- RESOURCE_EXHAUSTED\n  - when rate limit is exceeded"
      operationId: GetMarket
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/GetMarketResponse_2'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status_2'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/GetMarketRequest'
      tags:
      - MarketService
  /refb.merchant.v1.MarketService/ListMarkets:
    post:
      summary: Lists all markets.
      description: "Known errors:\n- UNAUTHENTICATED\n  - when no authorization header is sent\n  - when authorization header is malformed or invalid\n- PERMISSION_DENIED\n  - when the authorized user does not have permissions for this operation\n- INVALID_ARGUMENT\n  - when pagination limit is too large (>100)\n  - when both \"ending_before\" and \"starting_after\" are specified in pagination\n- RESOURCE_EXHAUSTED\n  - when rate limit is exceeded"
      operationId: ListMarkets
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/ListMarketsResponse_2'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/Status_2'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ListMarketsRequest'
      tags:
      - MarketService
definitions:
  GetMarketRequest:
    type: object
    properties:
      code:
        type: string
        description: The identifier of the market to get.
        required:
        - code
    required:
    - code
  ListMarketsResponse_2:
    type: object
    properties:
      markets:
        type: array
        items:
          $ref: '#/definitions/Market'
      has_more:
        type: boolean
        description: Indicates whether there are more results available.
  ListMarketsResponse:
    type: object
    properties:
      markets:
        type: array
        items:
          $ref: '#/definitions/Market'
        description: The markets found.
      has_more:
        type: boolean
        description: Indicates whether there are more results available.
  ListMarketsRequest.Sort:
    type: object
    properties:
      order:
        $ref: '#/definitions/SortOrder'
      by:
        $ref: '#/definitions/ListMarketsRequest.Sort.By'
  Market:
    type: object
    properties:
      code:
        type: string
        description: Primary key. Code of the market.
      is_site:
        type: boolean
        description: Indicates whether there exists a refurbed website for this market.
      type:
        $ref: '#/definitions/MarketType'
        description: Defines what type of market it is.
      name:
        type: string
        description: Human-readable name of the market.
      currency_code:
        $ref: '#/definitions/CurrencyCode'
        description: The market's currency.
    description: A market.
  MarketType:
    type: string
    enum:
    - UNSPECIFIED
    - COUNTRY
    default: UNSPECIFIED
    description: ' - COUNTRY: Market represents a country, in which case its code is equal to the

      2-letter ISO code of the country.'
  BoolFilter:
    type: object
    properties:
      value:
        type: boolean
        x-nullable: true
  GetMarketResponse:
    type: object
    properties:
      market:
        $ref: '#/definitions/Market'
        description: The market retrieved.
  ListMarketsRequest.Sort.By:
    type: string
    enum:
    - CODE
    - NAME
    default: CODE
  Any:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  SortOrder:
    type: string
    enum:
    - ASC
    - DESC
    default: ASC
  Status:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          $ref: '#/definitions/Any'
  ListMarketsRequest.Filter:
    type: object
    properties:
      code:
        $ref: '#/definitions/StringFilter'
      is_site:
        $ref: '#/definitions/BoolFilter'
      type:
        $ref: '#/definitions/MarketTypeFilter'
      currency:
        $ref: '#/definitions/CurrencyCodeFilter'
  MarketTypeFilter:
    type: object
    properties:
      any_of:
        type: array
        items:
          $ref: '#/definitions/MarketType'
      none_of:
        type: array
        items:
          $ref: '#/definitions/MarketType'
  GetMarketResponse_2:
    type: object
    properties:
      market:
        $ref: '#/definitions/Market'
  Status_2:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
      message:
        type: string
        description: 'A developer-facing error message, which should be in English. Any

          user-facing error message should be localized and sent in the

          [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.'
      details:
        type: array
        items:
          $ref: '#/definitions/Any_2'
        description: 'A list of messages that carry the error details.  There is a common set of

          message types for APIs to use.'
    description: 'The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in the

      [API Design Guide](https://cloud.google.com/apis/design/errors).'
  ListMarketsRequest:
    type: object
    properties:
      pagination:
        $ref: '#/definitions/StringPagination'
      sort:
        $ref: '#/definitions/ListMarketsRequest.Sort'
      filter:
        $ref: '#/definitions/ListMarketsRequest.Filter'
