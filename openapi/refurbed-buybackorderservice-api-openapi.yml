          - string
          - 'null'
          format: date-time
    v1.Address:
      type: object
      properties:
        first_name:
          type: string
        family_name:
          type: string
        entity:
          $ref: '#/components/schemas/AddressEntity'
        company_name:
          type:
          - string
          - 'null'
          description: The company name. Set for company addresses only.
        company_vatin:
          type:
          - string
          - 'null'
          description: The VAT identification number. Set for company *invoice* addresses only.
        personal_vatin:
          type:
          - string
          - 'null'
          description: The VAT identification number. Set for personal *invoice* addresses only.
        country_code:
          $ref: '#/components/schemas/CountryCode'
        post_code:
          type: string
        town:
          type: string
        street_name:
          type: string
        house_no:
          type:
          - string
          - 'null'
          description: 'The house number. This is optional as some countries know addresses

