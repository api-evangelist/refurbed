openapi: 3.2.0
info:
  title: Merchant Buyback Order Service API
  description: The refurbed merchant API allows to access and manage markets, currencies, instances, shipping profiles, offers, market offers, orders and order items.
  version: '1.0'
  contact:
    name: Refurbed Merchant Integrations Team
    email: integrations@refurbed.com
servers:
- url: https://api.refurbed.com
security:
- APIKeyAuth: []
tags:
- name: BuybackOrderService
paths:
  /refb.merchant.v1.BuybackOrderService/ListBuybackOrders:
    post:
      summary: Lists all buyback orders
      description: 'Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - INVALID_ARGUMENT

        - when pagination limit is too large (>100)

        - when both "ending_before" and "starting_after" are specified in pagination'
      operationId: ListBuybackOrders
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuybackOrdersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackOrderService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListBuybackOrdersRequest'
        required: true
components:
  schemas:
    BuybackOrderItemState:
      type: string
      enum:
      - UNSPECIFIED
      - ORDERED
      - LABEL_SENT
      - CANCELLED
      - RECEIVED
      - ACCEPTED
      - SECOND_OFFER
      - REJECTED
      - RETURNED
      default: UNSPECIFIED
      description: "- ORDERED: New order. Next state: LABEL_SENT\n - LABEL_SENT: Order item is ready to be shipped. Next state: CANCELLED, RECEIVED.\n - CANCELLED: Order item was never received. Final state.\n - RECEIVED: Order item was received by the merchant. Next state: ACCEPTED, SECOND_OFFER, REJECTED\n - ACCEPTED: Order item was accepted for fulfillment. Final Status\n - SECOND_OFFER: Order item was in worse conditions than expected, a second offer has been issued to the customer.\nNext state: ACCEPTED, REJECTED\n - REJECTED: Order item was refused. Next state: RETURNED\n - RETURNED: Order item was shipped back to customer. Final Status"
      title: Represents the state of an order item
    ListBuybackOrdersRequest.Sort.By:
      type: string
      enum:
      - ID
      - STATE
      - PRODUCT_NAME
      - CREATED_AT
      - SKU
      default: ID
    BuybackOrder:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Primary key.
        return_address:
          $ref: '#/components/schemas/v1.Address'
          title: The address to return the item(s) in case of rejection of second offer
        created_at:
          type: string
          format: date-time
          title: When the order was created
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/v1.BuybackOrderItem'
          title: List of items to ship
      description: A buyback order.
    ListBuybackOrdersRequest.Sort:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/SortOrder'
        by:
          $ref: '#/components/schemas/ListBuybackOrdersRequest.Sort.By'
    BuybackAttribute:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Attribute ID
        name:
          type: string
          description: Human-readable name.
        type:
          $ref: '#/components/schemas/BuybackAttributeType'
          description: Type for the attribute.
        value_str:
          $ref: '#/components/schemas/StringValue'
          description: Value is set if type is ENUM.
        value_num:
          $ref: '#/components/schemas/NumericValue'
          description: Value is set if type is NUMERIC.
    Int64Pagination:
      type: object
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Limit on the number of results to be returned. Between 1 and 100.

            Default and maximum is 100.'
        ending_before:
          type: string
          format: int64
        starting_after:
          type: string
          format: int64
      description: Paginates resources with int64 primary key.
    StringSetContainsFilter:
      type: object
      properties:
        any_of:
          type: array
          items:
            type: string
        none_of:
          type: array
          items:
            type: string
        contains:
          type:
          - string
          - 'null'
    Int64Filter:
      type: object
      properties:
        any_of:
          type: array
          items:
            type: string
            format: int64
        none_of:
          type: array
          items:
            type: string
            format: int64
    TimestampRangeFilter:
      type: object
      properties:
        gt:
          type:
          - string
          - 'null'
          format: date-time
        ge:
          type:
