    - CONFIGURATION_NO_LONGER_SOLD
    - NOT_ALLOWED_OFFER_PROPERTY
    default: UNSPECIFIED
    description: "- MISSING_REQUIREMENTS: Some of the mandatory parameters to determine what product the offer describes are missing\n - CONFIGURATION_DOES_NOT_EXIST: Product configuration does not exist as per manufacturer specification\n - CONFIGURATION_NOT_ALLOWED: Product described is not allowed to be sold due to platform rules\n - CONFIGURATION_NO_LONGER_SOLD: Product no longer allowed on the platform\n - NOT_ALLOWED_OFFER_PROPERTY: Offer request contained property that is not permitted for this category (e.g. battery)"
