        $ref: '#/definitions/InstanceDescriptor'
        description: 'The instance descriptor describes the instance an offer should be created on.

          If such instance can be unambiguously matched, the offer is created

          in state OK.

          Otherwise, an asynchronous approval process is started, and the offer

          is created in state PROCESSING.'
      sku:
        type: string
        required:
        - sku
      grading:
        $ref: '#/definitions/OfferGrading'
      warranty:
        $ref: '#/definitions/OfferWarranty'
      stock:
        type: integer
        format: int64
        required:
        - stock
      shipping_profile_id:
        type: string
        format: int64
        required:
        - shipping_profile_id
      secondary_shipping_profile_id:
        type: string
        format: int64
        x-nullable: true
      taxation:
        $ref: '#/definitions/OfferTaxation'
      reference_currency_code:
        $ref: '#/definitions/CurrencyCode'
      reference_price:
        type: string
        required:
        - reference_price
      reference_min_price:
        type: string
        x-nullable: true
      create_market_prices:
        type: array
        items:
          $ref: '#/definitions/Create.CreateMarketPrice'
        description: Market prices to create. This is equal to a batch MarketOfferService.CreateMarketOffer.
      battery_condition:
        $ref: '#/definitions/BatteryCondition'
        x-nullable: true
