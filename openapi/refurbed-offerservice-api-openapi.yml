        type: array
        items:
          $ref: '#/definitions/CreateOfferRequest.CreateMarketPrice'
        description: Market prices to create. This is equal to a batch MarketOfferService.CreateMarketOffer.
      battery_condition:
        $ref: '#/definitions/BatteryCondition'
        x-nullable: true
    description: See offer for full documentation.
    required:
    - sku
    - stock
    - shipping_profile_id
    - reference_price
  OfferSKUFilter:
