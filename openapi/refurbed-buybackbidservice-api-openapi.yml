openapi: 3.2.0
info:
  title: Merchant Buyback Bid Service API
  description: The refurbed merchant API allows to access and manage markets, currencies, instances, shipping profiles, offers, market offers, orders and order items.
  version: '1.0'
  contact:
    name: Refurbed Merchant Integrations Team
    email: integrations@refurbed.com
servers:
- url: https://api.refurbed.com
security:
- APIKeyAuth: []
tags:
- name: BuybackBidService
paths:
  /refb.merchant.v1.BuybackBidService/CreateBuybackBid:
    post:
      summary: Creates a single bid
      description: 'Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - INVALID_ARGUMENT

        - product does not exist

        - set of attributes is incompatible for a product

        - invalid input data is provided

        - ALREADY_EXISTS

        - there''s already an active bid for the given product, attributes and grade combination'
      operationId: CreateBuybackBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuybackBidResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuybackBidRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/CreateBuybackMarketBid:
    post:
      summary: Adds a new price for a marketplace inside an existing bid
      description: 'Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - INVALID_ARGUMENT

        - bid does not exist

        - invalid input data is provided

        - ALREADY_EXISTS

        - there''s already an active bid for the given market'
      operationId: CreateBuybackMarketBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuybackMarketBidResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuybackMarketBidRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/DeleteBuybackBid:
    post:
      summary: Deletes a single bid
      description: 'Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when bid is not found

        - INVALID_ARGUMENT

        - invalid input data is provided'
      operationId: DeleteBuybackBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBuybackBidRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/DeleteBuybackMarketBid:
    post:
      summary: Deletes a price for a marketplace inside an existing bid
      description: 'This is only allowed if the deletion doesn''t result in a bid without any market prices.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - market bid does not exist

        - FAILED_PRECONDITION

        - bid has only 1 market price remaining (i.e. bid requires manual deletion)'
      operationId: DeleteBuybackMarketBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBuybackMarketBidRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/GetSecondOfferBuybackMarketBid:
    post:
      summary: Gets a market bid available for making a second offer
      description: 'To make a second offer, the merchant has to find a different market bid and update the order item accordingly.

        In order to get a market bid for the second offer, the merchant has to provide the order item ID that they intend to change,

        as well as all the details about the actual device they have received. Only the price valid at the time of order

        creation will be returned, to ensure fair competition and prevent merchants from lowering the price before

        making the second offer.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - INVALID_ARGUMENT

        - invalid input data is provided

        - NOT_FOUND

        - order item does not exist or it''s not in "received" state

        - an appropriate market bid cannot be found that was active at the time of order'
      operationId: GetSecondOfferBuybackMarketBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSecondOfferBuybackMarketBidResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSecondOfferBuybackMarketBidRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/ListBuybackBids:
    post:
      summary: Lists all bids
      description: 'Returns the current bid versions only.


        Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - INVALID_ARGUMENT

        - when pagination limit is too large (>100)

        - when both "ending_before" and "starting_after" are specified in pagination'
      operationId: ListBuybackBids
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBuybackBidsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListBuybackBidsRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/UpdateBuybackBid:
    post:
      summary: Updates a single bid by setting its stock
      description: 'Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - when bid is not found

        - INVALID_ARGUMENT

        - invalid input data is provided'
      operationId: UpdateBuybackBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBuybackBidResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuybackBidRequest'
        required: true
  /refb.merchant.v1.BuybackBidService/UpdateBuybackMarketBid:
    post:
      summary: Sets the price for a marketplace for an existing bid
      description: 'Known errors:

        - UNAUTHENTICATED

        - when no authorization header is sent

        - when authorization header is malformed or invalid

        - PERMISSION_DENIED

        - when the authorized user does not have permissions for this operation

        - NOT_FOUND

        - market bid does not exist

        - INVALID_ARGUMENT

        - invalid input data is provided'
      operationId: UpdateBuybackMarketBid
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBuybackMarketBidResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      tags:
      - BuybackBidService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuybackMarketBidRequest'
        required: true
components:
  schemas:
    CreateBuybackBidResponse:
      type: object
      properties:
        bid:
          $ref: '#/components/schemas/BuybackBid'
    BuybackBid:
      type: object
      properties:
        id:
          type: string
          format: int64
          description: Primary key.
        product_id:
          type: string
          format: int64
          title: The product id
        product_name:
          type: string
          description: Human-readable name for the product.
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/BuybackAttribute'
          title: List of attributes assigned to the product
        stock:
          type:
          - integer
          - 'null'
          format: int64
          title: Stock the merchant is willing to buy. If undefined it means unlimited
        grading:
          $ref: '#/components/schemas/BuybackBidGrading'
          title: Grading for the desired product
        market_bids:
          type: array
          items:
            $ref: '#/components/schemas/BuybackMarketBid'
          description: Configured market bids. Unique by market code.
        sku:
          type:
          - string
          - 'null'
          title: Bid SKU
    UpdateBuybackMarketBidResponse:
      type: object
      properties:
        market_bid:
          $ref: '#/components/schemas/BuybackMarketBid'
    CreateBuybackBidRequest:
      type: object
      properties:
        product_id:
          type: string
          format: int64
          title: The Product id
          required:
          - product_id
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
          title: List of attributes assigned to the product
          required:
          - attributes
        stock:
          type:
          - integer
          - 'null'
          format: int64
          title: Stock to buy. If left undefined the stock will be considered unlimited
        grading:
          $ref: '#/components/schemas/BuybackBidGrading'
          title: Grading for the desired product
        market_bids:
          type: array
          items:
            $ref: '#/components/schemas/CreateBuybackMarketBid'
          title: Market bids to create
          required:
          - market_bids
        sku:
          type:
          - string
          - 'null'
          title: Bid SKU
      required:
      - product_id
      - attributes
      - market_bids
    BuybackMarketBid:
      type: object
      properties:
        bid_id:
          type: string
          format: int64
          title: Bid ID
        market_code:
          $ref: '#/components/schemas/CountryCode'
          title: Two-letter code indicating the market
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          title: Currency for the price
        price:
          type: string
          title: Price as a string containing a decimal number
        bid_sku:
          type:
          - string
          - 'null'
          title: Bid SKU
    ListBuybackBidsResponse:
      type: object
      properties:
        bids:
          type: array
          items:
            $ref: '#/components/schemas/BuybackBid'
          description: The bids found.
        has_more:
          type: boolean
          description: Indicates whether there are more results available.
    BuybackAttribute:
      type: object
      properties:
        id:
          type: string
          format: int64
          title: Attribute ID
        name:
          type: string
          description: Human-readable name.
        type:
          $ref: '#/components/schemas/BuybackAttributeType'
          description: Type for the attribute.
        value_str:
          $ref: '#/components/schemas/StringValue'
          description: Value is set if type is ENUM.
        value_num:
          $ref: '#/components/schemas/NumericValue'
          description: Value is set if type is NUMERIC.
    StringSetContainsFilter:
      type: object
      properties:
        any_of:
          type: array
          items:
            type: string
        none_of:
          type: array
          items:
            type: string
        contains:
          type:
          - string
          - 'null'
    Int64Filter:
      type: object
      properties:
        any_of:
          type: array
          items:
            type: string
            format: int64
        none_of:
          type: array
          items:
            type: string
            format: int64
    Int64Pagination:
      type: object
      properties:
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Limit on the number of results to be returned. Between 1 and 100.

            Default and maximum is 100.'
        ending_before:
          type: string
          format: int64
        starting_after:
          type: string
          format: int64
      description: Paginates resources with int64 primary key.
    DeleteBuybackBidRequest:
      type: object
      properties:
        identifier:
          $ref: '#/components/schemas/BuybackBidIdentifier'
          description: Accepts either bid ID or SKU.
          title: The identifier of the bid
    CurrencyCode:
