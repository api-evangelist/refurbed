          $ref: '#/components/schemas/BuybackBid'
    GetSecondOfferBuybackMarketBidRequest:
      type: object
      properties:
        order_item_id:
          type: string
          format: int64
          title: The ID of the product received (may be the same as order item's product ID)
          required:
          - order_item_id
        product_id:
          type: string
          format: int64
          title: The product ID of the product received (may be the same as order item's product ID)
          required:
          - product_id
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
          title: The list of attributes of the product received (may be the same as order item's attributes)
          required:
          - attributes
        grading:
          $ref: '#/components/schemas/BuybackBidGrading'
          title: 'The grading of the product received (same as order item''s grading, if the product received doesn''t have a

            different grading)'
      required:
      - order_item_id
      - product_id
      - attributes
    BuybackBidIdentifier:
      type: object
      properties:
        id:
          type: string
          format: int64
        sku:
          type: string
    Enum:
      type: object
      properties:
        id:
          type: string
          format: int64
        any_of:
          type: array
          items:
            type: string
        none_of:
          type: array
          items:
            type: string
    Attribute:
      type: object
      properties:
        value_str:
          $ref: '#/components/schemas/Enum'
        value_num:
          $ref: '#/components/schemas/Numeric'
    BuybackBidGrading:
      type: string
      enum:
      - UNSPECIFIED
      - A
      - B
      - C
      - D
      - E
      default: UNSPECIFIED
    BuybackAttributeType:
      type: string
      enum:
      - UNSPECIFIED
      - ENUM
      - NUMERIC
      default: UNSPECIFIED
      title: "- ENUM: An enumerated attribute has a string value, e.g. Colour = black.\n - NUMERIC: A numeric attribute has a numeric value with an optional unit, e.g.\nMemory = 2 GB"
    CreateBuybackMarketBidRequest:
      type: object
      properties:
        bid_identifier:
          $ref: '#/components/schemas/BuybackBidIdentifier'
          description: Accepts either bid ID or SKU.
          title: The identifier of the bid
        market_code:
          $ref: '#/components/schemas/CountryCode'
          title: Two-letter code indicating the market
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
          title: Currency for the price
        price:
          type: string
          title: Price as a string containing a decimal number
          required:
          - price
      required:
      - price
    CreateBuybackMarketBidResponse:
      type: object
      properties:
        market_bid:
          $ref: '#/components/schemas/BuybackMarketBid'
    NumericValue:
      type: object
      properties:
        value:
          type: number
          format: double
        unit:
