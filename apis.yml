aid: refurbed
name: Refurbed
description: >-
  Refurbed is a European online marketplace for professionally refurbished
  electronics and other sustainable goods, headquartered in Vienna, Austria and
  operating across Europe. Merchants sell refurbished phones, laptops, tablets,
  wearables and more to consumers through the refurbed platform, and refurbed
  exposes public partner APIs so merchants and affiliates can integrate
  programmatically. The Merchant API lets sellers manage offers, prices, stock,
  orders, returns, refunds, shipping profiles, tickets and buyback flows, while
  the Affiliate Partner API exposes the marketplace catalog (markets, products,
  instances and BuyBox data) for affiliates. Both APIs are offered as gRPC with
  an equivalent HTTP/JSON transport, defined by published Protobuf and OpenAPI
  (Swagger 2.0) specifications, and are authenticated with a secret token passed
  in the Authorization header.
url: https://raw.githubusercontent.com/api-evangelist/refurbed/refs/heads/main/apis.yml
